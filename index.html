<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Секретный квест для тебя</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{--bg:#efe8ff;--card:#fff;--ink:#2b1b4a;--soft:#6b5a8e;--pink:#ff7db0;--peach:#ffb38a;--mint:#7fe0c3;--line:#d8ccf5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241640;--card:#33205a;--ink:#f6efff;--soft:#c3b3e6;--line:#4b3680}}
:root[data-theme="dark"]{--bg:#241640;--card:#33205a;--ink:#f6efff;--soft:#c3b3e6;--line:#4b3680}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:2rem;line-height:1.15;margin:0 0 8px;font-weight:600}
p{margin:0 0 14px}
.lead{color:var(--soft);font-size:1.05rem}
.slots{display:flex;gap:6px;margin:22px 0}
.slot{flex:1;min-width:0;height:54px;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;font-size:1.5rem;font-weight:600;color:var(--soft);background:var(--card)}
.slot.on{border:2px solid var(--pink);color:var(--ink);background:var(--peach);animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:16px;border:2px solid var(--line)}
.card.locked{opacity:.45}
.card.done{border-color:var(--mint)}
.card h2{font-size:1.15rem;margin:0 0 8px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
button{font:inherit;font-weight:500;padding:12px 18px;border-radius:14px;border:0;background:var(--pink);color:#2b1b4a;cursor:pointer}
button:active{transform:scale(.97)}
.msg{min-height:1.4em;margin:8px 0 0;font-size:.95rem;color:var(--soft)}
.hint{background:none;color:var(--soft);padding:6px 0;text-decoration:underline;font-size:.9rem}
.final{text-align:center}
.final .big{font-size:1.1rem}
#secret{display:none;text-align:center;padding:26px 20px;border-radius:26px;background:var(--mint);color:#1d2b3a}
#secret h2{font-size:1.7rem;margin:0 0 10px}
#secret p{font-size:1.1rem;white-space:pre-line}
.bit{position:fixed;top:-30px;font-size:1.6rem;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <h1 id="title">Привет! У меня для тебя квест</h1>
  <p class="lead">Реши восемь заданий. За каждое получишь цифру. Из них собирается код, который открывает сюрприз.</p>
  <div class="slots" aria-label="Цифры кода">
    <div class="slot" id="s0">?</div><div class="slot" id="s1">?</div><div class="slot" id="s2">?</div><div class="slot" id="s3">?</div><div class="slot" id="s4">?</div><div class="slot" id="s5">?</div><div class="slot" id="s6">?</div><div class="slot" id="s7">?</div>
  </div>
  <div id="quests"></div>

  <section class="card final locked" id="finalCard">
    <h2>Финальный код</h2>
    <p class="big">Введи восемь цифр по порядку</p>
    <div class="row">
      <input id="code" inputmode="numeric" maxlength="8" placeholder="________" aria-label="Код" disabled>
      <button id="open" disabled>Открыть</button>
    </div>
    <p class="msg" id="finalMsg"></p>
  </section>

  <section id="secret" aria-live="polite">
    <h2 id="sTitle"></h2>
    <p id="sText"></p>
  </section>
</main>

<script>
/* ====== ЗДЕСЬ МЕНЯЕШЬ ПОД СЕБЯ ====== */
var HER_NAME = "Варя";
var QUESTS = [
  {title:"Математика", text:"Найди значение выражения: 3/4 от 48 минус 20% от 50.", answers:["26"], hint:"20% это одна пятая", digit:"4"},
  {title:"Русский язык", text:"Три из этих слов пишутся с двумя «н», одно с одной: серебряный, оловянный, стеклянный, деревянный. Какое слово пишется с одной «н»?", answers:["серебряный"], hint:"Оно про металл, но не про олово", digit:"9"},
  {title:"Шифр из цифр", text:"Каждое число это номер буквы в алфавите (А=1, Б=2... Я=33). Расшифруй слово: 20-1-11-15-1", answers:["тайна"], hint:"То, что держат в секрете", digit:"2"},
  {title:"Задом наперёд", text:"Слово записано в обратном порядке: АДЗЕВЗ", answers:["звезда"], hint:"Её видно ночью", digit:"8"},
  {title:"Загадка", text:"У меня есть города, но нет домов. Есть горы, но нет деревьев. Есть вода, но нет рыб. Что я?", answers:["карта","географическая карта"], hint:"Висит на стене в кабинете географии", digit:"1"},
  {title:"Сдвиг букв", text:"Каждая буква сдвинута на одну вперёд по алфавиту. Расшифруй слово: УПСУ", answers:["торт"], hint:"Сдвинь каждую букву на одну назад", digit:"6"},
  {title:"Про нас: начало", text:"Когда мы начали переписываться? Напиши дату.", answers:["24.10.2026","24.10.26","24.10","24 октября 2026","24 октября","24 окт"], hint:"", digit:"3"},
  {title:"Про нас: сериальчик", text:"Когда мы начали вести наш сериальчик в ТикТоке? Напиши дату.", answers:["26.10.2026","26.10.26","26.10","26 октября 2026","26 октября","26 окт"], hint:"", digit:"5"}
];
var SECRET_TITLE = "Ты справилась, ";
var SECRET_TEXT = "Если ты это читаешь, значит, прошла все мои загадки. Я в тебе не сомневался.\n\nМне захотелось сделать для тебя что-то особенное, а не просто написать «спасибо» в чате. С тобой весело и легко общаться, и я рад, что мы начали переписываться, а потом ещё и сериальчик в ТикТоке завели.\n\nСпасибо, что ты такая классная подруга. Надеюсь, впереди у нас ещё много шуток, сериалов и разговоров.\n\nОт твоего друга 💖";
/* ==================================== */

var FINAL = QUESTS.map(function(q){return q.digit}).join("");
var solved = 0;
document.getElementById("title").textContent = "Привет, " + HER_NAME + "! У меня для тебя квест";
var wrap = document.getElementById("quests");

function norm(s){return s.toLowerCase().replace(/ё/g,"е").replace(/(\d)\s*(года|г\.?)$/,"$1").replace(/(\d)[\/\-,](\d)/g,"$1.$2").replace(/\s+/g," ").trim()}

QUESTS.forEach(function(q, i){
  var c = document.createElement("section");
  c.className = "card" + (i ? " locked" : "");
  c.id = "q" + i;
  c.innerHTML = '<h2></h2><p></p><div class="row"><input aria-label="Ответ"><button>Проверить</button></div><p class="msg"></p><button class="hint">Нужна подсказка?</button>';
  c.querySelector("h2").textContent = q.title;
  c.querySelector("p").textContent = q.text;
  var input = c.querySelector("input"), btn = c.querySelector(".row button"), msg = c.querySelector(".msg"), hint = c.querySelector(".hint");
  input.disabled = btn.disabled = i !== 0;
  hint.onclick = function(){ msg.textContent = "Подсказка: " + q.hint; };
  if (!q.hint) hint.style.display = "none";
  function check(){
    if (q.answers.map(norm).indexOf(norm(input.value)) > -1){
      msg.textContent = "Верно! Твоя цифра: " + q.digit;
      c.classList.add("done"); input.disabled = btn.disabled = true; hint.style.display = "none";
      var s = document.getElementById("s" + i); s.textContent = q.digit; s.classList.add("on");
      solved++;
      var next = document.getElementById(i + 1 < QUESTS.length ? "q" + (i + 1) : "finalCard");
      next.classList.remove("locked");
      next.querySelectorAll("input,button").forEach(function(e){e.disabled = false});
    } else {
      msg.textContent = "Почти! Попробуй ещё раз.";
      c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
    }
  }
  btn.onclick = check;
  input.onkeydown = function(e){ if (e.key === "Enter") check(); };
  wrap.appendChild(c);
});

function confetti(){
  var set = ["💖","🌸","✨","💐","🎀","⭐"];
  for (var i = 0; i < 40; i++){
    var b = document.createElement("div");
    b.className = "bit"; b.textContent = set[i % set.length];
    b.style.left = Math.random() * 100 + "vw";
    b.style.animationDuration = (2.5 + Math.random() * 3) + "s";
    b.style.animationDelay = Math.random() * 1.2 + "s";
    document.body.appendChild(b);
    setTimeout(function(el){ el.remove(); }, 7500, b);
  }
}

document.getElementById("open").onclick = function(){
  var v = document.getElementById("code").value.trim(), m = document.getElementById("finalMsg"), card = document.getElementById("finalCard");
  if (v === FINAL){
    card.style.display = "none";
    var s = document.getElementById("secret");
    document.getElementById("sTitle").textContent = SECRET_TITLE + HER_NAME + "!";
    document.getElementById("sText").textContent = SECRET_TEXT;
    s.style.display = "block"; s.scrollIntoView({behavior:"smooth"});
    confetti();
  } else {
    m.textContent = "Код не подошёл. Проверь цифры сверху.";
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  }
};
</script>
</body>
</html>
